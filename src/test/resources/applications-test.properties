# ===============================================================
# CONFIGURAÇÕES DE TESTE - EchoesApp
# ===============================================================

spring.application.name=echoes-server-test

# 1. Banco de Dados em Memória (H2) para isolamento total
# Isso garante que o teste não dependa do seu MySQL local
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NOT_FIXED_PROPERTIES=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 2. Segurança e JWT
api.security.token.secret=secret_de_teste_muito_longo_para_o_algoritmo_hmac
server.ssl.enabled=false

# 3. Redis de Teste
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 4. Email (Mock/Logger)
# No teste, não queremos enviar e-mails reais. 
# O provedor 'logger' que você já tem é perfeito para isso.
twofactor.provider=logger
spring.mail.host=localhost
spring.mail.port=3025

# 5. Desabilitar Logs excessivos durante testes
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=INFO

# 6. Parâmetros extras obrigatórios do seu app
api.smtp.token=test-token
<!DOCTYPE html>
<html th:replace="fragments/layout :: layout('Gerenciar Termos', ~{::body})">
<body>

<div class="flex h-full">

  <div th:replace="fragments/sidebar :: sidebar"></div>

  <main class="flex-1 p-10 overflow-y-auto">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">
      Gerenciar Termos
    </h1>

    <div class="bg-white shadow rounded-lg p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Termos existentes</h2>
      <div id="terms-table-wrapper">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-700 uppercase bg-gray-100">
              <tr>
                <th class="px-4 py-3">Tipo</th>
                <th class="px-4 py-3">Versão</th>
                <th class="px-4 py-3">Ativo</th>
                <th class="px-4 py-3">Data</th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody id="terms-tbody">
              <tr>
                <td colspan="5" class="px-4 py-8 text-center text-gray-500">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="terms-pagination" class="flex items-center justify-between mt-4"></div>
      </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Nova versão</h2>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select id="terms-type"
                  class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            <option value="TERMS_OF_USE">Termos de Uso</option>
            <option value="PRIVACY_POLICY">Política de Privacidade</option>
            <option value="DATA_DELETION_POLICY">Política de Exclusão</option>
            <option value="MARKETING_CONSENT">Consentimento Marketing</option>
            <option value="COOKIES_POLICY">Política de Cookies</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nova versão</label>
          <input id="terms-version" type="text" placeholder="2.0.0"
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Conteúdo (HTML)</label>
        <textarea id="terms-content" rows="12" 
                  class="w-full px-3 py-2 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-primary"></textarea>
      </div>

      <div id="terms-preview" class="hidden mb-4 p-4 border rounded-lg bg-gray-50 prose prose-sm max-w-none"></div>

      <div class="flex gap-2">
        <button id="terms-preview-btn"
                class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition text-sm">
          Preview
        </button>
        <button id="terms-save-btn"
                class="bg-primary text-white px-4 py-2 rounded hover:bg-blue-900 transition text-sm">
          Salvar nova versão
        </button>
        <div id="terms-form-loading" class="hidden">
          <div class="animate-spin rounded-full h-6 w-6 border-2 border-gray-300 border-t-primary"></div>
        </div>
      </div>
    </div>

  </main>

</div>

<script th:src="@{/js/admin-terms.js}"></script>
</body>
</html>

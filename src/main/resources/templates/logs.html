<!DOCTYPE html>
<html th:replace="fragments/layout :: layout('Logs do Sistema', ~{::body})">
<body>

<div class="flex h-full">

  <div th:replace="fragments/sidebar :: sidebar"></div>

  <main class="flex-1 p-10 overflow-y-auto">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">
      Logs do Sistema
    </h1>

    <div class="bg-white shadow rounded-lg p-6">

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-xs text-gray-700 uppercase bg-gray-100">
            <tr>
              <th class="px-4 py-3">Data/Hora</th>
              <th class="px-4 py-3">Usuário</th>
              <th class="px-4 py-3">Ação</th>
              <th class="px-4 py-3">Entidade</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Detalhes</th>
              <th class="px-4 py-3">IP</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${logs.content}"
                class="border-b hover:bg-gray-50">
              <td class="px-4 py-3 text-xs whitespace-nowrap" th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm:ss')}">22/01/2025 14:30:00</td>
              <td class="px-4 py-3" th:text="${log.userId}">uuid</td>
              <td class="px-4 py-3" th:text="${log.action}">ação</td>
              <td class="px-4 py-3" th:text="${log.entity}">entidade</td>
              <td class="px-4 py-3" th:text="${log.status}">status</td>
              <td class="px-4 py-3 max-w-xs truncate" th:text="${log.details}">detalhes</td>
              <td class="px-4 py-3 text-xs" th:text="${log.ip}">0.0.0.0</td>
            </tr>
            <tr th:if="${logs.content.empty}">
              <td colspan="7" class="px-4 py-8 text-center text-gray-500">
                Nenhum log encontrado.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${logs.totalPages > 1}" class="flex items-center justify-between mt-6">
        <div class="text-sm text-gray-600">
          Página <span th:text="${logs.number + 1}">1</span>
          de <span th:text="${logs.totalPages}">1</span>
          (<span th:text="${logs.totalElements}">0</span> registros)
        </div>

        <div class="flex gap-2">
          <a th:if="${logs.hasPrevious()}"
             th:href="@{/dashboard/logs(page=${logs.number - 1}, size=${logs.size})}"
             class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-900 transition text-sm">
            Anterior
          </a>
          <span th:unless="${logs.hasPrevious()}"
                class="px-4 py-2 bg-gray-200 text-gray-400 rounded text-sm cursor-not-allowed">
            Anterior
          </span>

          <a th:if="${logs.hasNext()}"
             th:href="@{/dashboard/logs(page=${logs.number + 1}, size=${logs.size})}"
             class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-900 transition text-sm">
            Próximo
          </a>
          <span th:unless="${logs.hasNext()}"
                class="px-4 py-2 bg-gray-200 text-gray-400 rounded text-sm cursor-not-allowed">
            Próximo
          </span>
        </div>
      </div>

    </div>

  </main>

</div>

</body>
</html>

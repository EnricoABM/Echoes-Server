<!DOCTYPE html>
<html th:replace="fragments/layout :: layout('Reativar', ~{::body})">

<body>

  <main class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">

      <h1 class="text-2xl text-primary font-bold text-center mb-6">
        Reativar conta
      </h1>

      <!-- STEP 1: EMAIL -->
      <form id="reactivate-form" class="flex flex-col gap-2">

        <input id="email"
        class="w-full border p-2 rounded mb-4"
        placeholder="Email"
        type="email">

        <div id="reactivate-loading" class="hidden flex justify-center mt-4">
          <div class="animate-spin rounded-full h-6 w-6 border-2 border-gray-300 border-t-primary"></div>
        </div>
        <br>

        <div class="flex flex-col gap-1">
          <label class="block text-sm font-medium text-gray-700">Você deve aceitar os termos para continuar</label>
          <label class="block text-sm text-gray-700">
            <input
                type="checkbox"
                id="accept-terms"
                required
                >
            <span>
              Aceitar os 
              <a class="text-primary" href="/api/terms/TERMS_OF_USE" target="_blank">
                Termos de Uso
              </a>,
              <a class="text-primary" href="/api/terms/PRIVACY_POLICY" target="_blank">Política de privacidade</a> e
              <a class="text-primary" href="/api/terms/COOKIES_POLICY" target="_blank">Política de cookies</a>,
            </span>
          </label>
        </div>

        <button
          type="submit"
          class="bg-primary w-full text-white p-2 rounded">
          Enviar código
        </button>

      </form>

      <!-- STEP 2: CODE + NEW PASSWORD -->
      <form id="reset-form" class="hidden">

        <p class="text-sm text-gray-600 mb-3">
        Digite o código enviado para seu email
        </p>

        <input id="code"
        class="w-full border p-2 rounded mb-3"
        placeholder="Código"
        type="text"
        minlength="6"
        inputmode="numeric"
        pattern="\d{6}"
        title="Digite um código de 6 dígitos"
        required
        >

        <div id="reset-loading" class="hidden flex justify-center mt-4">
          <div class="animate-spin rounded-full h-6 w-6 border-2 border-gray-300 border-t-primary"></div>
        </div>
        <br>

        <button
          class="bg-primary w-full text-white p-2 rounded"
          type="submit">
          Reativar conta
        </button>

      </form>

      <p class="text-center text-sm text-gray-600 mt-4">
      Sua conta já está ativada?
      <a href="/" class="text-primary font-medium hover:underline">
        Voltar ao login
      </a>
      </p>

    </div>

    <script th:src="@{/js/reactivate.js}"></script>
  </main>

</body>
</html>
